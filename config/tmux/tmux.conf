# Mouse scroll/select/resize
set -g mouse on
# Bigger scrollback for training logs
set -g history-limit 100000
# No delay after Esc (vim etc.)
set -sg escape-time 10
set -g default-terminal "tmux-256color"
# Truecolor when attached from foot, whose terminfo doesn't advertise it
set -as terminal-features ",foot*:RGB"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# Show hostname so you know which machine you're on
set -g status-right "#H  %H:%M"
